<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Court Booking Bot{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  {% if user %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/jobs">Court Booking Bot</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/jobs">Jobs</a>
        <a class="nav-link" href="/jobs/new">New Job</a>
        <a class="nav-link" href="/facilities">Facilities</a>
        <a class="nav-link" href="/credentials">Credentials</a>
        <a class="nav-link" href="#" id="logout-link">Log out</a>
      </div>
    </div>
  </nav>
  {% endif %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logout = document.getElementById('logout-link');
      if (logout) {
        logout.addEventListener('click', async (e) => {
          e.preventDefault();
          await fetch('/api/logout', { method: 'POST' });
          window.location.href = '/login';
        });
      }
    });

    async function apiFetch(url, options = {}) {
      const opts = Object.assign({ headers: { 'Content-Type': 'application/json' } }, options);
      const res = await fetch(url, opts);
      if (!res.ok) {
        const body = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(body.detail || 'Request failed');
      }
      return res.status === 204 ? null : res.json();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
