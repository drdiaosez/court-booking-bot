{% extends "base.html" %}
{% block title %}Booking Jobs{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Booking Jobs</h2>
  <a href="/jobs/new" class="btn btn-primary">+ New Job</a>
</div>
<div id="job-list"></div>
{% endblock %}
{% block scripts %}
<script>
const statusColors = {
  scheduled: 'secondary', prewarming: 'info', running: 'primary',
  success: 'success', failed: 'danger', cancelled: 'dark',
};

async function loadJobs() {
  const jobs = await apiFetch('/api/jobs');
  document.getElementById('job-list').innerHTML = jobs.map(j => `
    <a class="text-decoration-none" href="/jobs/${j.id}">
      <div class="card">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <strong>Facility #${j.facility_id}</strong> &mdash; ${j.target_date} ${j.start_time}&ndash;${j.end_time}
            ${j.court_preference ? '(' + j.court_preference + ')' : ''}
            <div class="text-muted small">Fires at ${new Date(j.run_at + 'Z').toLocaleString()}</div>
          </div>
          <span class="badge bg-${statusColors[j.status] || 'secondary'} status-badge">${j.status}</span>
        </div>
      </div>
    </a>
  `).join('') || '<p class="text-muted">No jobs yet. Create one to get started.</p>';
}
loadJobs();
setInterval(loadJobs, 10000);
</script>
{% endblock %}
