{% extends "base.html" %}
{% block title %}Credentials{% endblock %}
{% block content %}
<h2 class="mb-3">Your facility logins</h2>
<p class="text-muted">Passwords are encrypted at rest and only decrypted in memory at the moment a booking job runs.</p>

<div class="card">
  <div class="card-body">
    <h5 class="card-title">Add a login</h5>
    <div id="cred-error" class="alert alert-danger d-none"></div>
    <form id="cred-form" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Facility</label>
        <select class="form-select" name="facility_id" id="facility-select" required></select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Username / email</label>
        <input class="form-control" name="username" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Member ID (optional)</label>
        <input class="form-control" name="member_id">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Save login</button>
      </div>
    </form>
  </div>
</div>

<div id="cred-list"></div>
{% endblock %}
{% block scripts %}
<script>
async function loadFacilitySelect() {
  const facilities = await apiFetch('/api/facilities');
  document.getElementById('facility-select').innerHTML = facilities.map(f => `<option value="${f.id}">${f.name}</option>`).join('')
    || '<option disabled>Add a facility first</option>';
}

async function loadCredentials() {
  const creds = await apiFetch('/api/credentials');
  document.getElementById('cred-list').innerHTML = creds.map(c => `
    <div class="card">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <strong>${c.facility_name}</strong> &mdash; ${c.username} ${c.member_id ? '(member ' + c.member_id + ')' : ''}
        </div>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteCred(${c.id})">Remove</button>
      </div>
    </div>
  `).join('') || '<p class="text-muted">No saved logins yet.</p>';
}

async function deleteCred(id) {
  await apiFetch(`/api/credentials/${id}`, { method: 'DELETE' });
  loadCredentials();
}

document.getElementById('cred-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const payload = {
    facility_id: parseInt(form.get('facility_id'), 10),
    username: form.get('username'),
    password: form.get('password'),
    member_id: form.get('member_id') || null,
  };
  const errorEl = document.getElementById('cred-error');
  errorEl.classList.add('d-none');
  try {
    await apiFetch('/api/credentials', { method: 'POST', body: JSON.stringify(payload) });
    e.target.reset();
    loadCredentials();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('d-none');
  }
});

loadFacilitySelect();
loadCredentials();
</script>
{% endblock %}
